server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The client is JS-heavy — compress text assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static assets for a week (sets Expires + Cache-Control: max-age=604800).
    location ~* \.(?:js|css|png|jpe?g|gif|svg|woff2?)$ {
        expires 7d;
    }
}

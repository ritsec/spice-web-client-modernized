<!DOCTYPE html>
<!--
 Test harness page for the Spice Web Client unit tests.

   1. vendored test libraries (chai, sinon)          -> unittest/vendor/
   2. the runner core (defines suite/setup/teardown/test) -> unittest/runner.js
   3. the application scripts in the same order as index.html (minus run.js,
      which would try to start a real SPICE session)
   4. the graphic-test data URI list                  -> unittest/graphictestfiles/uris.js
   5. every unittest/*.test.js file
   6. an inline call to window.wdiTestRun() that executes the registered tests

 The runner then publishes the result in window.__wdi_test_results.
 tools/run-tests.mjs drives this page headlessly.

 Open this page directly (serving the repository root, e.g. `npm run serve`)
 for an in-browser run with a human-readable console report.

 -->

        <!-- Minimal DOM scaffolding mirroring ../index.html so code that
             queries these elements at construction time finds them. -->
        <div id="login"></div>
        <div id="screen"></div>
        <input type="text" id="hiddeninput" style="display:none;opacity:0;font-size: 60px;color:transparent"/>
        <div id="canvasSpace" style="display: none; height: 1024px"></div>
        <div id="graphicDebug" style="display: none;">
            <div id="debugInfo"></div>
        </div>
        <div id="overlay"></div>
        <div id="error"><div id="error_text"></div></div>
        <div id="extwin"><div id="extwin-title"></div></div>
        <!-- execution: run everything registered above. Placed at the end of the
             body so DOM scaffolding is parsed before the runner's synchronous phase
             executes (the runner starts its first test immediately on call). -->
        <script>
            try { window.wdiTestRun(); }
            catch (e) { window.__wdi_test_results = { error: 'runner failed to start: ' + ((e && e.message) || e) }; }
        </script>
    </body>
